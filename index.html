<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1219">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RepBank">
<title>RepBank</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#0F1219; --slab:#171C26; --slab2:#1F2632; --line:#262E3D; --line2:#333D50;
  --bone:#ECEAE4; --mute:#7E889C; --dim:#5A6376;
  --amber:#F2A63C; --amber-lo:#6B4C1D;
  --sage:#5FB392; --sage-lo:#24483B;
  --disp:'Anton',Impact,'Arial Narrow Bold',sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
html,body{margin:0;padding:0;background:var(--ink)}
body{color:var(--bone);font-family:var(--body);min-height:100vh;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
input{font-family:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.wrap{padding:0 14px;max-width:620px;margin:0 auto}
.top{padding:calc(18px + env(safe-area-inset-top)) 14px 4px;max-width:620px;margin:0 auto}
.top h2{font-family:var(--disp);font-size:30px;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1}
.top .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-top:7px}
.top .sub b{color:var(--amber);font-weight:500}

.card{background:var(--slab);border:1px solid var(--line);border-radius:var(--r);margin-bottom:11px;overflow:hidden}
.card[data-done="1"]{border-color:var(--sage-lo)}

.chd{display:flex;align-items:flex-start;gap:12px;padding:14px 15px 0}
.chd .l{min-width:0;flex:1}
.chd .mg{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.chd .nm{font-size:15px;font-weight:600;line-height:1.3;margin-top:4px;letter-spacing:-.01em}
.chd .r{text-align:right;flex:0 0 auto}
.chd .r .n{font-family:var(--disp);font-size:34px;line-height:.9;color:var(--amber);display:block}
.card[data-done="1"] .chd .r .n{color:var(--sage)}
.chd .r .u{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:block;margin-top:4px}

.tally{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;padding:13px 15px 0}
.tally[data-cols="12"]{grid-template-columns:repeat(12,1fr)}
.tally[data-cols="20"]{grid-template-columns:repeat(20,1fr);gap:2px}
.tally i{aspect-ratio:1;border:1px solid var(--line2);border-radius:2px}
.tally i[data-s="old"]{background:var(--amber-lo);border-color:var(--amber-lo)}
.tally i[data-s="new"]{background:var(--amber);border-color:var(--amber)}
.tally i[data-s="done"]{background:var(--sage-lo);border-color:var(--sage-lo)}
.tally i[data-pb="1"]{box-shadow:inset 0 0 0 1.5px var(--bone)}

.goal{display:flex;justify-content:space-between;align-items:center;padding:11px 15px 0;
  font-family:var(--mono);font-size:11px;color:var(--mute)}
.goal b{color:var(--bone);font-weight:500}
.goal .go{color:var(--amber)}
.card[data-done="1"] .goal .go{color:var(--sage)}

.sets{padding:12px 15px 0}
.set{display:flex;align-items:center;gap:11px;padding:7px 0;font-family:var(--mono);font-size:13px;
  border-bottom:1px solid var(--line)}
.set .i{color:var(--dim);font-size:9.5px;width:20px;letter-spacing:.1em}
.set .v{flex:1}
.set .v em{font-style:normal;color:var(--dim);font-size:10.5px}
.set button{color:var(--dim);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:6px 2px}

.entry{display:flex;gap:8px;padding:12px 15px 0}
.st{flex:1;display:flex;align-items:stretch;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--slab2)}
.st button{width:42px;font-family:var(--disp);font-size:21px;color:var(--mute);flex:0 0 auto}
.st button:active{color:var(--amber);background:var(--line)}
.st input{flex:1;min-width:0;width:100%;text-align:center;background:transparent;border:none;outline:none;
  color:var(--bone);font-family:var(--disp);font-size:24px;padding:11px 0}
.st .tag{position:absolute}
.stl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  padding:0 15px;margin-top:6px;display:flex;gap:8px}
.stl span{flex:1}
.add{margin:10px 15px 15px;display:block;width:calc(100% - 30px);padding:14px;background:var(--amber);
  color:var(--ink);font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;border-radius:8px;text-align:center}
.card[data-done="1"] .add{background:var(--sage)}

.foot{display:flex;border-top:1px solid var(--line);margin-top:14px}
.foot button{flex:1;padding:12px 8px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim)}
.foot button+button{border-left:1px solid var(--line)}

.row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--mute);padding:4px 0;gap:12px}
.row b{color:var(--bone);font-weight:500;text-align:right}
.detail{padding:13px 15px;border-top:1px solid var(--line)}
.spark{width:100%;height:50px;display:block;margin:8px 0 4px}

/* compact progress rows */
.prow{display:block;width:100%;text-align:left;background:var(--slab);border:1px solid var(--line);
  border-radius:var(--r);margin-bottom:8px;padding:13px 15px}
.prow[data-done="1"]{border-color:var(--sage-lo)}
.prow .a{display:flex;align-items:baseline;gap:10px}
.prow .nm{font-size:14px;font-weight:600;flex:1;min-width:0;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .w{font-family:var(--disp);font-size:19px;color:var(--amber);flex:0 0 auto}
.prow[data-done="1"] .w{color:var(--sage)}
.prow .b{display:flex;align-items:center;gap:9px;margin-top:9px}
.mini{display:flex;gap:2.5px;flex:1}
.mini i{height:5px;flex:1;border-radius:1px;background:var(--line)}
.mini i[data-s="1"]{background:var(--amber)}
.mini i[data-s="p"]{background:var(--amber-lo)}
.prow[data-done="1"] .mini i[data-s="1"]{background:var(--sage)}
.prow .c{font-family:var(--mono);font-size:10px;color:var(--dim);flex:0 0 auto;letter-spacing:.06em}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 14px 12px;margin:0 auto;max-width:620px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:7px 12px;border:1px solid var(--line);color:var(--mute);white-space:nowrap;border-radius:99px}
.chip[data-on="1"]{border-color:var(--amber);color:var(--amber)}

.ghost{display:block;width:100%;padding:14px;border:1px dashed var(--line2);border-radius:var(--r);
  color:var(--mute);font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  text-align:center;margin-bottom:11px}
.solid{display:block;width:100%;padding:15px;background:var(--amber);color:var(--ink);border-radius:var(--r);
  font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;text-align:center}
.solid[data-alt="1"]{background:transparent;border:1px solid var(--line2);color:var(--mute);font-weight:400}

.sess{background:var(--slab);border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;padding:13px 15px}
.sess .d{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--amber)}
.sess .ex{margin-top:10px}
.sess .ex .n{font-size:13.5px;font-weight:600}
.sess .ex .s{font-family:var(--mono);font-size:11.5px;color:var(--mute);margin-top:3px;line-height:1.7}

.sheet-bg{position:fixed;inset:0;background:rgba(8,10,14,.78);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--slab);border-top:1px solid var(--line2);
  border-radius:16px 16px 0 0;max-height:88vh;overflow-y:auto;max-width:620px;margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom)}
.sheet-h{position:sticky;top:0;background:var(--slab);border-bottom:1px solid var(--line);padding:15px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:16px 16px 0 0}
.sheet-h .nm{font-size:15px;font-weight:600}
.sheet-h button{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.search{width:100%;padding:13px 14px;background:var(--slab2);border:1px solid var(--line2);border-radius:8px;
  color:var(--bone);font-size:16px;outline:none}
.search:focus{border-color:var(--amber)}
.pgrp{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:16px 16px 6px}
.pick{display:block;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
.pick .n{font-size:14px}
.pick .m{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:3px}

.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:rgba(15,18,25,.97);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;padding:13px 4px 15px;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim)}
.nav button[data-on="1"]{color:var(--amber);box-shadow:inset 0 2px 0 var(--amber)}

.rest{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom));z-index:29;
  display:flex;align-items:center;gap:11px;padding:11px 15px;background:var(--slab2);
  border-top:1px solid var(--line2);max-width:620px;margin:0 auto}
.rest .bar{position:absolute;left:0;right:0;top:0;height:2px;background:var(--line)}
.rest .bar i{display:block;height:100%;background:var(--amber)}
.rest[data-over="1"] .bar i{background:var(--sage)}
.rest .t{font-family:var(--disp);font-size:21px;color:var(--amber);flex:1;letter-spacing:.03em}
.rest[data-over="1"] .t{color:var(--sage);font-size:15px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase}
.rest button{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--mute);padding:8px 10px;border:1px solid var(--line2);border-radius:7px}

.usebtn{display:block;width:calc(100% - 30px);margin:10px 15px 0;padding:9px;border:1px dashed var(--line2);
  border-radius:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.usebtn:active{border-color:var(--amber);color:var(--amber)}
.pr{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink);background:var(--sage);padding:2px 6px;border-radius:99px;margin-left:7px;font-weight:600}
.last{font-family:var(--mono);font-size:10.5px;color:var(--dim);padding:11px 15px 0;line-height:1.6}
.last b{color:var(--mute);font-weight:400}
.notebox{margin:11px 15px 0;width:calc(100% - 30px);background:var(--slab2);border:1px solid var(--line2);
  border-radius:8px;color:var(--bone);font-family:var(--body);font-size:13.5px;padding:11px;outline:none;resize:vertical;min-height:62px}
.notebox:focus{border-color:var(--amber)}
.srow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.srow .sl{flex:1;min-width:0}
.srow .sl .k{font-size:13.5px}
.srow .sl .sn{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:4px;line-height:1.6}
.sst{display:flex;align-items:center;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:0 0 auto}
.sst button{width:40px;padding:9px 0;font-family:var(--disp);font-size:19px;color:var(--mute);background:var(--slab2)}
.sst button:active{color:var(--amber)}
.sst span{min-width:62px;text-align:center;font-family:var(--mono);font-size:13px;padding:0 6px}
.bwrow{display:flex;align-items:center;gap:11px;background:var(--slab);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 15px;margin-bottom:11px}
.bwrow .l{flex:1;min-width:0}
.bwrow .k{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.bwrow .v{font-family:var(--disp);font-size:22px;margin-top:3px}
.bwrow .v em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.08em}
.bwrow button{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--mute);
  border:1px solid var(--line2);border-radius:7px;padding:10px 13px}
.empty{text-align:center;padding:40px 20px 28px;color:var(--mute);font-size:13.5px;line-height:1.65}
.note{font-family:var(--mono);font-size:10.5px;color:var(--dim);line-height:1.75}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  z-index:50;background:var(--amber);color:var(--ink);padding:10px 17px;border-radius:99px;font-family:var(--mono);
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="rest"></div>
<div id="toast"></div>
<script>
"use strict";
const SEED = {"entries":[],"timeEntries":[],"bank":[{"n":"Iso-lateral Decline Chest Press","m":"Chest","c":"Strength","pt":"Strength Score"},{"n":"Incline Bench Press","m":"Chest","c":"Strength","pt":"Strength Score"},{"n":"Push-ups","m":"Chest","c":"Strength","pt":"Strength Score"},{"n":"Iso-Lateral Incline Chest Press","m":"Chest","c":"Strength","pt":"Strength Score"},{"n":"Push Up","m":"Chest","c":"Strength","pt":"Strength Score"},{"n":"Hammer Strength Assisted Pull-up","m":"Back","c":"Strength","pt":"Strength Score"},{"n":"Basic Back Extension","m":"Back","c":"Strength","pt":"Strength Score"},{"n":"Barbell Row","m":"Back","c":"Strength","pt":"Strength Score"},{"n":"Iso-lateral pull","m":"Back","c":"Strength","pt":"Strength Score"},{"n":"Pull Up","m":"Back","c":"Strength","pt":"Strength Score"},{"n":"Deadlift","m":"Back","c":"Strength","pt":"Strength Score"},{"n":"Shoulder Press","m":"Shoulders","c":"Strength","pt":"Strength Score"},{"n":"Dumbbell Shoulder Press","m":"Shoulders","c":"Strength","pt":"Strength Score"},{"n":"Lateral Raise","m":"Shoulders","c":"Strength","pt":"Strength Score"},{"n":"Iso-Lateral Shoulder Press","m":"Shoulders","c":"Strength","pt":"Strength Score"},{"n":"Face Pull","m":"Shoulders","c":"Strength","pt":"Strength Score"},{"n":"Hammer Strength ground base squat/lunge both legs","m":"Legs","c":"Strength","pt":"Strength Score"},{"n":"Hammer strength ground base squat/lunge single leg","m":"Legs","c":"Strength","pt":"Strength Score"},{"n":"Hammer Strength Leg extension Single Leg","m":"Legs","c":"Strength","pt":"Strength Score"},{"n":"Hip Adduction","m":"Legs","c":"Strength","pt":"Strength Score"},{"n":"Hip Abduction","m":"Legs","c":"Strength","pt":"Strength Score"},{"n":"Leg Extension","m":"Legs","c":"Strength","pt":"Strength Score"},{"n":"Calf Raise","m":"Legs","c":"Strength","pt":"Strength Score"},{"n":"Bicep Curl (Bar)","m":"Arms","c":"Strength","pt":"Strength Score"},{"n":"Bicep Curl (Dumbbell)","m":"Arms","c":"Strength","pt":"Strength Score"},{"n":"Tricep Pulldown","m":"Arms","c":"Strength","pt":"Strength Score"},{"n":"Skull Crusher","m":"Arms","c":"Strength","pt":"Strength Score"},{"n":"Dips","m":"Arms","c":"Strength","pt":"Strength Score"},{"n":"Cable Crunch","m":"Core","c":"Strength","pt":"Strength Score"},{"n":"Leg Raises","m":"Core","c":"Strength","pt":"Strength Score"},{"n":"Russian Twist","m":"Core","c":"Strength","pt":"Strength Score"},{"n":"Hanging Knee Raise","m":"Core","c":"Strength","pt":"Strength Score"},{"n":"Kettlebell Swing","m":"Full Body","c":"Strength","pt":"Strength Score"},{"n":"Farmer Carry","m":"Full Body","c":"Strength","pt":"Strength Score"},{"n":"Clean and Press","m":"Full Body","c":"Strength","pt":"Strength Score"},{"n":"Run 1km","m":"Cardio","c":"Time-Based","pt":"Speed"},{"n":"Run 3km","m":"Cardio","c":"Time-Based","pt":"Speed"},{"n":"Run 5km","m":"Cardio","c":"Time-Based","pt":"Speed"},{"n":"Run 10km","m":"Cardio","c":"Time-Based","pt":"Speed"},{"n":"Bike","m":"Cardio","c":"Time-Based","pt":"Speed"},{"n":"Rowing Machine","m":"Cardio","c":"Time-Based","pt":"Speed"},{"n":"Plank","m":"Core","c":"Time-Based","pt":"Hold Time"},{"n":"Side Plank","m":"Core","c":"Time-Based","pt":"Hold Time"},{"n":"Hollow Hold","m":"Core","c":"Time-Based","pt":"Hold Time"},{"n":"Wall Sit","m":"Legs","c":"Time-Based","pt":"Hold Time"}]};
const KEY = "gym:v1";
const APP_VERSION = "5.0";   // bumped whenever the app changes
const DATA_VERSION = 3;      // bumped only when the shape of stored data changes
const DEFAULTS = {rest:90, goalSets:10, goalReps:10, step:2.5, perEx:{}};

/* Brings older saved data up to the current shape. Each step is additive, so a
   log written by any previous version keeps working after an update. */
function migrate(d){
  if(!d) return d;
  const from = d.v || 0;
  if(from < 2){
    d.bodyweight = d.bodyweight || [];        // [{d:'YYYY-MM-DD', kg:Number}]
    d.settings   = Object.assign({}, DEFAULTS, d.settings || {});
    // entries gain an optional .note; absent is fine, nothing to convert
  }
  if(from < 3){
    // the 10x10 rep bank was hard-coded; it becomes a setting anyone can change
    d.settings = Object.assign({}, DEFAULTS, d.settings || {});
    if(d.settings.goalSets==null) d.settings.goalSets = 10;
    if(d.settings.goalReps==null) d.settings.goalReps = 10;
    if(d.settings.step==null)     d.settings.step = 2.5;
    d.settings.perEx = d.settings.perEx || {};
  }
  d.v = DATA_VERSION;
  return d;
}

/* ---------- storage ---------- */
let storageOK = true;
function load(){ try{ const r=localStorage.getItem(KEY); if(r) return migrate(JSON.parse(r)); }
  catch(e){ storageOK=false; } return null; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(D)); }
  catch(e){ storageOK=false; toast("Couldn't save"); } }

/* ---------- helpers ---------- */
const $=(s)=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,"0");
function todayISO(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function fmtDate(iso){const[y,m,d]=iso.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});}
function agoLabel(iso){const[y,m,d]=iso.split("-").map(Number);const t=new Date(y,m-1,d);
  const n=new Date();n.setHours(0,0,0,0);const k=Math.round((n-t)/86400000);
  if(k<=0)return"today"; if(k===1)return"yesterday"; if(k<7)return k+"d ago";
  if(k<14)return"1w ago"; if(k<70)return Math.floor(k/7)+"w ago"; return Math.floor(k/30)+"mo ago";}
const epley=(w,r)=>w*(1+r/30);
const nice=n=>String(Math.round(n*100)/100);

/* ---------- goal logic ---------- */
function isBW(es){ const w=es.flatMap(e=>e.sets.map(s=>s.w)); return w.length ? Math.max(...w)<=1 : false; }

function analyse(es,G){
  const sorted=[...es].sort((a,b)=>a.d<b.d?1:-1), lastDate=sorted[0].d;
  const last=sorted.filter(e=>e.d===lastDate);
  const cum=new Map();
  for(const e of es) for(const s of e.sets) cum.set(s.w,(cum.get(s.w)||0)+s.r);
  const lastWeights=[...new Set(last.flatMap(e=>e.sets.map(s=>s.w)))].sort((a,b)=>a-b);
  const open=lastWeights.filter(w=>(cum.get(w)||0)<G);
  const best1rm=Math.max(...es.flatMap(e=>e.sets.map(s=>epley(s.w,s.r))));
  const trend=[...es].sort((a,b)=>a.d<b.d?-1:1).map(e=>({d:e.d,v:Math.max(...e.sets.map(s=>epley(s.w,s.r)))}));
  if(!open.length){
    const w=lastWeights[lastWeights.length-1];
    return {complete:true,lastDate,weight:w,G,banked:G,toGo:0,fromLast:0,lastWeights,cum,best1rm,trend};
  }
  const weight=open[0], banked=cum.get(weight)||0;
  const fromLast=last.reduce((t,e)=>t+e.sets.filter(s=>s.w===weight).reduce((u,s)=>u+s.r,0),0);
  return {complete:false,lastDate,weight,G,banked,toGo:G-banked,fromLast,lastWeights,cum,best1rm,trend};
}

function analyseBW(es){
  const sorted=[...es].sort((a,b)=>a.d<b.d?1:-1), lastDate=sorted[0].d;
  const last=sorted.filter(e=>e.d===lastDate);
  const lastBest=Math.max(...last.flatMap(e=>e.sets.map(s=>s.r)));
  const trend=[...es].sort((a,b)=>a.d<b.d?-1:1).map(e=>({d:e.d,v:Math.max(...e.sets.map(s=>s.r))}));
  const pb=Math.max(...trend.map(t=>t.v));
  const before=trend.slice(0,-1), prevPB=before.length?Math.max(...before.map(t=>t.v)):0;
  const fresh=lastBest>=pb&&lastBest>prevPB;
  const totalReps=es.reduce((t,e)=>t+e.sets.reduce((u,s)=>u+s.r,0),0);
  return {bw:true,lastDate,pb,prevPB,lastBest,target:pb+1,fresh,totalReps,trend,sessions:es.length,weight:1};
}

/* Goal for an exercise: its own override if it has one, otherwise the global
   setting. Returns the sets x reps breakdown as well as the total to bank. */
function goalFor(name){
  const g=D.settings, o=(g.perEx&&g.perEx[name])||null;
  const sets=(o&&o.sets)||g.goalSets, reps=(o&&o.reps)||g.goalReps;
  const step=(o&&o.step)||g.step;
  return {sets,reps,target:Math.max(1,sets*reps),step,custom:!!o};
}

/* Best marks set BEFORE a given date, so today's sets can be judged against
   history rather than against themselves. */
function priorBest(name, beforeDate){
  const es=D.entries.filter(e=>e.e===name && e.sets.length && e.d<beforeDate);
  if(!es.length) return null;
  const all=es.flatMap(e=>e.sets);
  const bw=Math.max(...all.map(s=>s.w))<=1;
  return {bw,
    reps: Math.max(...all.map(s=>s.r)),
    weight: Math.max(...all.map(s=>s.w)),
    orm: Math.max(...all.map(s=>epley(s.w,s.r)))};
}
/* Which PR, if any, a set represents. Assisted machines use negative weights,
   so a *higher* number means less help — max() reads correctly either way. */
function prKind(set, pb){
  if(!pb) return null;
  if(pb.bw) return set.r>pb.reps ? "reps" : null;
  if(set.w>pb.weight) return "weight";
  if(set.w>0 && epley(set.w,set.r)>pb.orm) return "1rm";
  return null;
}

/* An exercise just added to today's session has no sets yet, so there is
   nothing to analyse — give it a blank slate rather than a broken card. */
function blank(){
  return {isNew:true,complete:false,lastDate:todayISO(),weight:0,G:100,banked:0,toGo:100,
          fromLast:0,lastWeights:[],cum:new Map(),best1rm:0,trend:[]};
}
function stats(){
  const by=new Map();
  for(const e of D.entries){ if(!by.has(e.e)) by.set(e.e,[]); by.get(e.e).push(e); }
  return [...by.entries()].map(([name,es])=>{
    const g=goalFor(name);
    const logged=es.filter(e=>e.sets.length);
    const a = !logged.length ? Object.assign(blank(),{G:g.target}) : (isBW(logged)?analyseBW(logged):analyse(logged,g.target));
    a.goal=g;
    return {name,muscle:es[0].m||"Other",a,n:logged.length};
  }).sort((a,b)=>a.a.lastDate<b.a.lastDate?1:a.a.lastDate>b.a.lastDate?-1:a.name.localeCompare(b.name));
}
function todayEntries(){ const t=todayISO(); return D.entries.filter(e=>e.d===t); }

let restEnd=0, restTot=0, restTick=null, restDone=0;
function beep(){
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    const c=new C(), o=c.createOscillator(), g=c.createGain();
    o.connect(g); g.connect(c.destination); o.type="sine"; o.frequency.value=880;
    g.gain.setValueAtTime(0.0001,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25,c.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.6);
    o.start(); o.stop(c.currentTime+0.62);
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([120,80,120]); }catch(e){}
}
function startRest(){
  const secs=Number(D.settings.rest)||0;
  if(!secs){ return; }
  restTot=secs; restEnd=Date.now()+secs*1000; restDone=0;
  if(restTick) clearInterval(restTick);
  restTick=setInterval(paintRest,300);
  paintRest();
}
function stopRest(){ if(restTick) clearInterval(restTick); restTick=null; restEnd=0; restDone=0; $("#rest").innerHTML=""; }
function mmss(n){ n=Math.max(0,n); return Math.floor(n/60)+":"+pad(n%60); }
function paintRest(){
  const el=$("#rest");
  const left=Math.ceil((restEnd-Date.now())/1000);
  if(left<=0){
    if(!restDone){ restDone=1; beep(); }
    el.innerHTML='<div class="rest" data-over="1"><div class="bar"><i style="width:100%"></i></div>'
      +'<span class="t">Rest done</span><button data-act="restclose">Clear</button></div>';
    if(Date.now()-restEnd>8000) stopRest();
    return;
  }
  const pct=Math.round(((restTot-left)/restTot)*100);
  el.innerHTML='<div class="rest"><div class="bar"><i style="width:'+pct+'%"></i></div>'
    +'<span class="t">'+mmss(left)+'</span>'
    +'<button data-act="restsub">−30</button><button data-act="restadd">+30</button>'
    +'<button data-act="restclose">Skip</button></div>';
}

/* ---------- fragments ---------- */
function tallyHTML(a){
  if(a.bw){
    const cells=a.target, cols=cells>20?12:10;
    let o='<div class="tally" data-cols="'+cols+'" aria-label="Best set '+a.lastBest+' of '+a.target+'">';
    for(let i=0;i<cells;i++) o+='<i data-s="'+(i<a.lastBest?(a.fresh?"done":"new"):"")+'"'+(i===a.pb-1?' data-pb="1"':'')+'></i>';
    return o+"</div>";
  }
  const G=a.G||100;
  const cols = G>140 ? 20 : 10;
  const filled=Math.min(a.banked,G), fresh=Math.min(a.fromLast||0,filled), oldN=filled-fresh;
  let o='<div class="tally" data-cols="'+cols+'" aria-label="'+filled+' of '+G+' reps banked">';
  for(let i=0;i<G;i++) o+='<i data-s="'+(a.complete?(i<filled?"done":""):(i<oldN?"old":(i<filled?"new":"")))+'"></i>';
  return o+"</div>";
}
function miniHTML(a){
  let o='<div class="mini">', pct = a.bw ? a.lastBest/a.target : Math.min(a.banked,a.G||100)/(a.G||100);
  const full=Math.floor(pct*10), part=(pct*10)-full>0.05;
  for(let i=0;i<10;i++) o+='<i data-s="'+(i<full?"1":(i===full&&part?"p":""))+'"></i>';
  return o+"</div>";
}
function sparkHTML(trend){
  if(!trend||trend.length<2) return "";
  const w=300,h=50,p=4,vals=trend.map(t=>t.v);
  const lo=Math.min(...vals),hi=Math.max(...vals),span=(hi-lo)||1,n=trend.length;
  const X=i=>p+(i*(w-p*2))/(n-1), Y=v=>h-p-((v-lo)/span)*(h-p*2);
  const d=trend.map((t,i)=>(i?"L":"M")+X(i).toFixed(1)+","+Y(t.v).toFixed(1)).join(" ");
  const sx=(n-1)/2, sy=vals.reduce((a,b)=>a+b,0)/n; let nu=0,de=0;
  vals.forEach((v,i)=>{nu+=(i-sx)*(v-sy);de+=(i-sx)*(i-sx);});
  const m=de?nu/de:0;
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="Progress over time">'
    +'<line x1="'+X(0)+'" y1="'+Y(sy+m*(0-sx))+'" x2="'+X(n-1)+'" y2="'+Y(sy+m*(n-1-sx))+'" stroke="#5FB392" stroke-width="1" stroke-dasharray="3 3" opacity=".65"/>'
    +'<path d="'+d+'" fill="none" stroke="#F2A63C" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>'
    +trend.map((t,i)=>'<circle cx="'+X(i)+'" cy="'+Y(t.v)+'" r="1.8" fill="#F2A63C"/>').join("")+'</svg>';
}

/* headline number + unit for a card */
function head(a){
  if(a.isNew) return {n:"—", u:"first session"};
  if(a.bw) return {n:a.pb, u:(a.fresh?"new best · reps":"best set · reps")};
  if(a.complete) return {n:nice(Math.abs(a.weight)), u:(a.weight<0?"cleared · kg assist":"cleared · kg")};
  return {n:nice(Math.abs(a.weight)), u:(a.weight<0?"working · kg assist":"working · kg")};
}
function goalLine(a){
  if(a.isNew) return '<span>no history yet</span><span class="go">Log your first set</span>';
  if(a.bw) return a.fresh
    ? '<span>up from <b>'+a.prevPB+'</b></span><span class="go">Beat '+a.target+' next</span>'
    : '<span>last session <b>'+a.lastBest+'</b></span><span class="go">'+(a.target-a.lastBest)+' more for a best</span>';
  const G=a.G||100;
  return a.complete
    ? '<span><b>'+G+'</b> reps banked</span><span class="go">'+(a.weight<0?"Cut the assist":"Go heavier")+'</span>'
    : '<span><b>'+a.banked+'</b> of '+G+' reps</span><span class="go">'+a.toGo+' to go</span>';
}

      +'<span class="w">'+(a.bw?a.pb+'<span style="font-size:11px"> reps</span>':nice(Math.abs(a.weight))+'<span style="font-size:11px"> kg</span>')+'</span></span>'
      +'<span class="b">'+miniHTML(a)
      +'<span class="c">'+(a.isNew?"new":(a.bw?(done?"best":a.lastBest+"/"+a.target):(a.complete?"cleared":a.banked+"/"+(a.G||100))))+' · '+agoLabel(a.lastDate)+'</span></span></button>'
      + (open?detailHTML(s)
          +'<button class="solid" data-act="totoday" data-v="'+i+'" style="margin-top:12px">Add to today</button>'
          +'<button class="solid" data-alt="1" data-act="wipe" data-v="'+i+'" style="margin-top:8px">Delete exercise</button>':"")
      +'</div>';
  }
  if(!shown.length) h+='<div class="empty">Nothing in this group yet.</div>';
  return h+'</div>';
}

/* ---------- history / data ---------- */
function viewHistory(){
  const by=new Map();
  for(const e of D.entries){ if(!by.has(e.d)) by.set(e.d,[]); by.get(e.d).push(e); }
  const days=[...by.entries()].sort((a,b)=>a[0]<b[0]?1:-1);
  let h='<div class="top"><h2>History</h2><div class="sub">'+days.length+' sessions</div></div><div class="wrap">';
  for(const [d,es] of days){
    h+='<div class="sess"><div class="d">'+fmtDate(d)+'</div>';
    for(const e of es) h+='<div class="ex"><div class="n">'+esc(e.e)+'</div><div class="s">'
      +e.sets.map(s=>(Math.abs(s.w)<=1?s.r+"":nice(Math.abs(s.w))+"×"+s.r)).join("&nbsp;&nbsp; ")+'</div>'
      +(e.note?'<div class="note" style="margin-top:5px;color:var(--mute)">'+esc(e.note)+'</div>':"")
      +'</div>';
    const bw=(D.bodyweight||[]).find(x=>x.d===d);
    if(bw) h+='<div class="note" style="margin-top:10px">Bodyweight '+nice(bw.kg)+' kg</div>';
    h+='</div>';
  }
  if(!days.length) h+='<div class="empty">No sessions yet.</div>';
  return h+'</div>';
}
function stepCycle(cur,dir){
  const steps=[0.5,1,1.25,2,2.5,5,10];
  let i=steps.indexOf(Number(cur)); if(i<0) i=4;
  i=Math.min(steps.length-1,Math.max(0,i+dir));
  return steps[i];
}
function sRow(label,val,act,note){
  return '<div class="srow"><div class="sl"><div class="k">'+label+'</div>'
    +(note?'<div class="sn">'+note+'</div>':"")+'</div>'
    +'<div class="sst"><button data-act="'+act+'" data-d="-1" aria-label="Decrease '+label+'">−</button>'
    +'<span>'+val+'</span>'
    +'<button data-act="'+act+'" data-d="1" aria-label="Increase '+label+'">+</button></div></div>';
}
function viewData(){
  const days=new Set(D.entries.map(e=>e.d)).size;
  const reps=D.entries.reduce((t,e)=>t+e.sets.reduce((u,s)=>u+s.r,0),0);
  const g=D.settings;
  const overrides=Object.keys(g.perEx||{});
  return '<div class="top"><h2>Settings</h2><div class="sub">'+D.entries.length+' entries · '+days+' days · '+reps+' reps</div></div><div class="wrap">'
    +(storageOK?"":'<div class="note" style="color:var(--amber);margin-bottom:16px">Storage is blocked here, so changes won\'t survive a refresh.</div>')

    +'<div class="eyebrow" style="margin:2px 0 9px">Rep bank goal</div>'
    + sRow("Sets to bank", g.goalSets, "setsets")
    + sRow("Reps per set", g.goalReps, "setreps")
    +'<div class="srow" style="border:none;padding-top:4px"><div class="sl"><div class="k" style="color:var(--amber)">'
      +g.goalSets+' × '+g.goalReps+' = '+(g.goalSets*g.goalReps)+' reps</div>'
      +'<div class="sn">Bank this many reps at a weight before moving up.</div></div></div>'
    + sRow("Weight increment", nice(g.step)+" kg", "setstep", "How much to add when a weight is cleared.")
    + sRow("Rest timer", Number(g.rest)?mmss(Number(g.rest)):"Off", "setrest", "Starts automatically after each set.")
    +(overrides.length?'<div class="note" style="margin:12px 0 0">'+overrides.length+' exercise'+(overrides.length>1?"s have":" has")+' a custom goal. Change or clear it from that exercise under Progress.</div>':"")

    +'<div class="eyebrow" style="margin:26px 0 9px">Your data</div>'
    +'<button class="solid" data-act="csv">Export CSV for Excel</button>'
    +'<div class="note" style="margin:9px 0 16px">Same columns as your workbook, plus bodyweight and notes.</div>'
    +'<button class="solid" data-alt="1" data-act="backup">Save a backup file</button>'
    +'<div class="note" style="margin:9px 0 16px">Full copy you can restore from. Worth doing monthly.</div>'
    +'<button class="solid" data-alt="1" data-act="restore">Restore from a backup</button>'
    +'<div class="note" style="margin:9px 0 16px">Replaces everything in the app.</div>'
    +'<button class="solid" data-alt="1" data-act="reset">Start over</button>'

    +'<div class="note" style="margin-top:24px"><b style="color:var(--mute)">Weighted:</b> a weight clears once it banks '
    +(g.goalSets*g.goalReps)+' reps. Your working weight is the lightest from your last session that hasn\'t cleared — '
    +'heavier sets bank toward their own goals.<br><br>'
    +'<b style="color:var(--mute)">Bodyweight:</b> anything at 1 kg. No load to add, so the goal is beating your best single set.<br><br>'
    +'<b style="color:var(--mute)">Removing things:</b> “Remove from today” clears an exercise from this session only. '
    +'“Delete exercise” under Progress erases it and all its history for good.</div>'
    +'<div class="note" style="margin:22px 0 0;opacity:.55">RepBank v'+APP_VERSION+' · data format '+DATA_VERSION+' · works offline</div></div>';
}

/* ---------- render ---------- */
function render(){
  $("#app").innerHTML =
    (S.tab==="today"?viewToday():S.tab==="progress"?viewProgress():S.tab==="history"?viewHistory():viewData())
    +'<div class="nav">'+[["today","Today"],["progress","Progress"],["history","History"],["data","Data"]]
      .map(([k,l])=>'<button data-act="tab" data-v="'+k+'" data-on="'+(S.tab===k?1:0)+'">'+l+'</button>').join("")+'</div>';
  renderSheet();
}
function renderSheet(){
  const el=$("#sheet");
  if(!S.picking){ el.innerHTML=""; return; }
  const q=S.q.toLowerCase(), st=stats();
  const recent=st.filter(x=>x.n>0).slice(0,6).map(x=>x.name);
  const all=D.bank.filter(b=>b.c==="Strength"&&b.n.toLowerCase().includes(q));
  const isNew=S.q.trim()&&!D.bank.some(b=>b.n.toLowerCase()===S.q.trim().toLowerCase());
  const logged=n=>D.entries.some(e=>e.e===n&&e.sets.length);
  const item=(n,m)=> S.editing
    ? '<div class="pick" style="display:flex;align-items:center;gap:10px">'
      +'<div style="flex:1;min-width:0"><div class="n">'+esc(n)+'</div><div class="m">'+esc(m)+(logged(n)?" · has history":"")+'</div></div>'
      +'<button data-act="wipe" data-v="'+esc(n)+'" style="color:var(--amber);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:8px">Delete</button></div>'
    : '<button class="pick" data-act="pickone" data-v="'+esc(n)+'" data-m="'+esc(m)+'"><div class="n">'+esc(n)+'</div><div class="m">'+esc(m)+'</div></button>';

  el.innerHTML='<div class="sheet-bg" data-act="close"></div><div class="sheet" role="dialog" aria-label="Add exercise">'
    +'<div class="sheet-h"><div class="nm">'+(S.editing?"Delete exercises":"Add exercise")+'</div>'
    +'<div style="display:flex;gap:14px"><button data-act="editmode">'+(S.editing?"Done":"Edit")+'</button>'
    +'<button data-act="close">Close</button></div></div>'
    +'<div style="padding:14px 16px 0"><input id="q" class="search" placeholder="'+(S.editing?"Search to find one":"Search or type a new one")+'" value="'+esc(S.q)+'"></div>'
    +(isNew&&!S.editing
      ? '<div class="pgrp">New exercise · pick a muscle group</div>'
        +'<div style="padding:0 16px 4px;display:flex;flex-wrap:wrap;gap:6px">'
        +muscleGroups().map(g=>'<button class="chip" data-act="newex" data-v="'+esc(S.q.trim())+'" data-m="'+esc(g)+'">'+esc(g)+'</button>').join("")
        +'</div><div class="note" style="padding:8px 16px 0">Creates “'+esc(S.q.trim())+'” and adds it to today.</div>'
      : "")
    +(!q&&!S.editing&&recent.length?'<div class="pgrp">Recent</div>'+recent.map(n=>item(n,(st.find(x=>x.name===n)||{}).muscle||"Other")).join(""):"")
    +'<div class="pgrp">'+(q?"Matching":"All exercises")+'</div>'
    +(all.length?all.map(b=>item(b.n,b.m)).join(""):'<div class="note" style="padding:4px 16px">Nothing matches.</div>')
    +'<div style="height:26px"></div></div>';
  const i=$("#q"); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); }
}

/* ---------- actions ---------- */
function addSet(name){
  const st=stats().find(s=>s.name===name);
  const bw=st&&st.a.bw;
  const wi=$("#w_"+slug(name)), ri=$("#r_"+slug(name));
  const w=bw?1:parseFloat(wi.value), r=parseInt(ri.value,10);
  if(!bw && wi.value.trim()===""){ toast("Enter a weight"); return; }
  if(ri.value.trim()===""){ toast("Enter your reps"); return; }
  if(isNaN(w)||isNaN(r)||r<=0){ toast("Check the numbers"); return; }
  delete S.draft[name];
  const t=todayISO();
  const pb=priorBest(name,t);
  let e=D.entries.find(x=>x.d===t&&x.e===name);
  if(e) e.sets.push({w,r});
  else {
    const b=D.bank.find(x=>x.n===name);
    D.entries.push({id:uid(),d:t,e:name,m:(b&&b.m)||"Other",sets:[{w,r}]});
  }
  const kind=prKind({w,r},pb);
  save(); render(); startRest();
  toast(kind ? (kind==="reps"?"New rep PR · "+r:kind==="weight"?(w<0?"New assist PR":"New weight PR · "+nice(w)+" kg"):"New estimated 1RM PR")
             : (bw?r+" reps banked":nice(Math.abs(w))+" × "+r+" banked"));
}
function download(n,t,ty){ const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([t],{type:ty})); a.download=n;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},900); }
function exportCSV(){
  const max=Math.max(1,...D.entries.map(e=>e.sets.length));
  const head=["Date","Exercise","Muscle Group"];
  for(let i=1;i<=max;i++) head.push("Set "+i+" Weight","Set "+i+" Reps");
  head.push("Session Volume","Best Set Estimated Strength Score","Bodyweight","Notes");
  const rows=[...D.entries].sort((a,b)=>a.d<b.d?-1:1).map(e=>{
    const r=[e.d,e.e,e.m||""];
    for(let i=0;i<max;i++){ r.push(e.sets[i]?e.sets[i].w:"",e.sets[i]?e.sets[i].r:""); }
    const bw=(D.bodyweight||[]).find(x=>x.d===e.d);
    r.push(e.sets.reduce((t,s)=>t+s.w*s.r,0),nice(Math.max(...e.sets.map(s=>epley(s.w,s.r)))),
           bw?bw.kg:"", e.note||"");
    return r; });
  download("gym-log-"+todayISO()+".csv",
    [head,...rows].map(r=>r.map(c=>/[",\n]/.test(String(c))?'"'+String(c).replace(/"/g,'""')+'"':c).join(",")).join("\n"),
    "text/csv");
}
function restore(){
  const i=document.createElement("input"); i.type="file"; i.accept=".json,application/json";
  i.onchange=()=>{ const f=i.files[0]; if(!f) return; const fr=new FileReader();
    fr.onload=()=>{ try{ const p=JSON.parse(fr.result);
        if(!p||!Array.isArray(p.entries)) throw 0;
        D=migrate(p); save(); render(); toast("Backup restored");
      }catch(e){ toast("Not a RepBank backup"); } };
    fr.readAsText(f); };
  i.click();
}

document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-act]"); if(!t) return;
  const act=t.dataset.act, v=t.dataset.v;
  if(act==="tab"){ S.tab=v; S.expanded=null; render(); }
  else if(act==="filter"){ S.filter=v; render(); }
  else if(act==="expand"){ S.expanded=S.expanded===v?null:v; render(); }
  else if(act==="pick"){ S.picking=true; S.q=""; S.editing=false; renderSheet(); }
  else if(act==="close"){ S.picking=false; S.editing=false; renderSheet(); }
  else if(act==="editmode"){ S.editing=!S.editing; renderSheet(); }
  else if(act==="newex"){
    const m=t.dataset.m, tI=todayISO();
    if(!D.bank.some(b=>b.n===v)) D.bank.push({n:v,m:m,c:"Strength",pt:"Strength Score"});
    if(!D.entries.some(e=>e.d===tI&&e.e===v)) D.entries.push({id:uid(),d:tI,e:v,m:m,sets:[]});
    save(); S.picking=false; S.q=""; S.tab="today"; render(); toast(v+" added");
  }
  else if(act==="drop"){
    const tI=todayISO();
    const e=D.entries.find(x=>x.d===tI&&x.e===v);
    if(!e) return;
    if(e.sets.length && !confirm("Remove "+v+" from today? Its "+e.sets.length+" set"+(e.sets.length>1?"s":"")+" will be deleted. Earlier sessions are untouched.")) return;
    D.entries=D.entries.filter(x=>!(x.d===tI&&x.e===v));
    delete S.draft[v]; save(); render(); toast("Removed from today");
  }
  else if(act==="wipe"){
    const n=D.entries.filter(e=>e.e===v&&e.sets.length).length;
    const msg = n
      ? "Delete "+v+" completely? This erases "+n+" session"+(n>1?"s":"")+" of history and can't be undone."
      : "Remove "+v+" from your exercise list?";
    if(!confirm(msg)) return;
    D.entries=D.entries.filter(e=>e.e!==v);
    D.bank=D.bank.filter(b=>b.n!==v);
    delete S.draft[v];
    if(S.expanded===v) S.expanded=null;
    save(); render(); toast(v+" deleted");
  }
  else if(act==="pickone"){
    S.picking=false; S.editing=false;
    const tI=todayISO();
    if(!D.entries.some(e=>e.d===tI&&e.e===v)){
      if(!D.bank.some(b=>b.n===v)) D.bank.push({n:v,m:t.dataset.m,c:"Strength",pt:"Strength Score"});
      D.entries.push({id:uid(),d:tI,e:v,m:t.dataset.m,sets:[]});
      save();
    }
    S.tab="today"; render();
  }
  else if(act==="totoday"){
    const tI=todayISO();
    if(!D.entries.some(e=>e.d===tI&&e.e===v)){
      const b=D.bank.find(x=>x.n===v)||{m:"Other"};
      D.entries.push({id:uid(),d:tI,e:v,m:b.m,sets:[]}); save();
    }
    S.tab="today"; S.expanded=null; render();
  }
  else if(act==="bump"){
    const f=t.dataset.f, dir=Number(t.dataset.d), inp=$("#"+f+"_"+slug(v));
    const step=f==="w"?(goalFor(v).step||2.5):1;
    let n=parseFloat(inp.value); if(isNaN(n)) n=0;
    n=Math.round((n+dir*step)*100)/100;
    if(f==="r"&&n<0) n=0;
    inp.value=f==="w"?nice(n):String(n);
    S.draft[v]=S.draft[v]||{}; S.draft[v][f]=n;
  }
  else if(act==="add"){ addSet(v); }
  else if(act==="undo"){
    const k=Number(t.dataset.k), tI=todayISO();
    const i=D.entries.findIndex(x=>x.d===tI&&x.e===v);
    if(i<0) return;
    D.entries[i].sets.splice(k,1); save(); render();
  }
  else if(act==="restclose"){ stopRest(); }
  else if(act==="restadd"){ restEnd+=30000; restTot+=30; restDone=0; paintRest(); }
  else if(act==="restsub"){ restEnd-=30000; restTot=Math.max(1,restTot-30); paintRest(); }
  else if(act==="note"){ S.noting=v; render();
    const n=document.querySelector('[data-act="notetext"]'); if(n){ n.focus(); } }
  else if(act==="bwedit"){ S.bwEdit=true; render(); }
  else if(act==="bwcancel"){ S.bwEdit=false; render(); }
  else if(act==="bwbump"){
    const inp=$("#bwv"); let n=parseFloat(inp.value); if(isNaN(n)) n=80;
    inp.value=nice(Math.max(0,Math.round((n+Number(t.dataset.d)*0.5)*10)/10));
  }
  else if(act==="bwsave"){
    const n=parseFloat($("#bwv").value);
    if(isNaN(n)||n<=0){ toast("Check the number"); return; }
    const day=todayISO();
    D.bodyweight=(D.bodyweight||[]).filter(x=>x.d!==day);
    D.bodyweight.push({d:day,kg:n});
    S.bwEdit=false; save(); render(); toast(nice(n)+" kg logged");
  }
  else if(act==="setrest"){
    const steps=[0,30,45,60,75,90,105,120,150,180,240,300];
    let i=steps.indexOf(Number(D.settings.rest)||0); if(i<0) i=5;
    i=Math.min(steps.length-1,Math.max(0,i+Number(t.dataset.d)));
    D.settings.rest=steps[i]; save(); render();
  }
  else if(act==="setsets"){
    D.settings.goalSets=Math.min(30,Math.max(1,(D.settings.goalSets||10)+Number(t.dataset.d)));
    save(); render();
  }
  else if(act==="setreps"){
    D.settings.goalReps=Math.min(50,Math.max(1,(D.settings.goalReps||10)+Number(t.dataset.d)));
    save(); render();
  }
  else if(act==="setstep"){
    D.settings.step=stepCycle(D.settings.step,Number(t.dataset.d));
    save(); render();
  }
  else if(act==="exsets"||act==="exreps"||act==="exstep"){
    const g=goalFor(v); const p=D.settings.perEx=D.settings.perEx||{};
    const o=p[v]=p[v]||{sets:g.sets,reps:g.reps,step:g.step};
    if(act==="exsets") o.sets=Math.min(30,Math.max(1,o.sets+Number(t.dataset.d)));
    if(act==="exreps") o.reps=Math.min(50,Math.max(1,o.reps+Number(t.dataset.d)));
    if(act==="exstep") o.step=stepCycle(o.step,Number(t.dataset.d));
    save(); render();
  }
  else if(act==="exclear"){
    if(D.settings.perEx) delete D.settings.perEx[v];
    save(); render(); toast("Back to the default goal");
  }
  else if(act==="use"){
    const st=stats().find(x=>x.name===v); if(!st) return;
    const g=suggestFor(st);
    S.draft[v]={w:st.a.bw?"":nice(g.w), r:String(g.r)};
    render();
  }
  else if(act==="csv"){ exportCSV(); }
  else if(act==="backup"){ download("repbank-backup-"+todayISO()+".json",JSON.stringify(D),"application/json"); }
  else if(act==="restore"){ restore(); }
  else if(act==="reset"){
    if(confirm("Clear everything and reload the original workbook data?")){
      D={entries:SEED.entries.map(e=>Object.assign({id:uid()},e)),timeEntries:SEED.timeEntries,bank:SEED.bank};
      S.draft={}; save(); render(); toast("Reset");
    }
  }
});
document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.id==="q"){ S.q=el.value; renderSheet(); return; }
  if(el.dataset&&el.dataset.act==="notetext"){
    const day=todayISO();
    const e=D.entries.find(x=>x.d===day&&x.e===el.dataset.v);
    if(e){ e.note=el.value; save(); }
    return;
  }
  if(el.dataset&&el.dataset.act==="edit"){
    const n=parseFloat(el.value);
    if(!isNaN(n)){ S.draft[el.dataset.v]=S.draft[el.dataset.v]||{}; S.draft[el.dataset.v][el.dataset.f]=n; }
  }
});

render();
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
