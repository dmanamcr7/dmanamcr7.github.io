<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1219">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RepBank">
<title>RepBank</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#0F1219; --slab:#181D28; --slab2:#212837; --line:#2C3446;
  --bone:#ECEAE4; --mute:#818B9F;
  --amber:#F2A63C; --amber-lo:#6E4E1E;
  --sage:#5FB392; --sage-lo:#254A3C;
  --disp:'Anton',Impact,'Arial Narrow Bold',sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
html,body{margin:0;padding:0;background:var(--ink)}
body{color:var(--bone);font-family:var(--body);min-height:100vh;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
input{font-family:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.hdr{position:sticky;top:0;z-index:20;background:rgba(15,18,25,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:baseline;justify-content:space-between}
.hdr h1{font-family:var(--disp);font-size:21px;letter-spacing:.09em;margin:0;text-transform:uppercase}
.hdr h1 span{color:var(--amber)}
.hdr .date{font-family:var(--mono);font-size:10.5px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}

.wrap{padding:16px;max-width:640px;margin:0 auto}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}

.strip{border:1px solid var(--line);border-left:3px solid var(--amber);background:var(--slab);padding:11px 13px;margin-bottom:18px}
.strip .t{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.strip .b{font-size:13.5px;margin-top:3px;line-height:1.45}

.chips{display:flex;gap:6px;overflow-x:auto;padding:0 16px 14px;margin:0 -16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  padding:7px 11px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip[data-on="1"]{border-color:var(--amber);color:var(--amber)}

.card{border:1px solid var(--line);background:var(--slab);margin-bottom:12px}
.card[data-done="1"]{border-color:var(--sage-lo)}
.card-h{padding:13px 14px 0}
.card-h .mg{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.card-h .nm{font-size:15px;font-weight:600;line-height:1.25;margin-top:3px;letter-spacing:-.01em}
.card-h .ago{font-family:var(--mono);font-size:10px;color:var(--mute);margin-top:4px}

.wt{display:flex;align-items:flex-end;gap:9px;padding:12px 14px 10px}
.wt .n{font-family:var(--disp);font-size:52px;line-height:.84;color:var(--amber)}
.card[data-done="1"] .wt .n{color:var(--sage)}
.wt .u{font-family:var(--mono);font-size:12px;color:var(--mute);padding-bottom:4px}
.wt .lbl{margin-left:auto;text-align:right;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--mute);line-height:1.6;padding-bottom:3px}

.tally{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;padding:0 14px 11px}
.tally i{aspect-ratio:1;border:1px solid var(--line);border-radius:1px}
.tally i[data-s="old"]{background:var(--amber-lo);border-color:var(--amber-lo)}
.tally i[data-s="new"]{background:var(--amber);border-color:var(--amber)}
.tally i[data-s="done"]{background:var(--sage-lo);border-color:var(--sage-lo)}
.tally i[data-pb="1"]{box-shadow:inset 0 0 0 1px var(--bone)}
.tally[data-cols="12"]{grid-template-columns:repeat(12,1fr)}

.meter{display:flex;justify-content:space-between;align-items:center;padding:0 14px 12px;font-family:var(--mono);font-size:11px;color:var(--mute)}
.meter b{color:var(--bone);font-weight:500}
.meter .go{color:var(--amber)}
.card[data-done="1"] .meter .go{color:var(--sage)}

.cardbtns{display:flex;border-top:1px solid var(--line)}
.cardbtns button{flex:1;padding:13px 8px;font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--mute)}
.cardbtns button+button{border-left:1px solid var(--line)}
.cardbtns .go{color:var(--ink);background:var(--amber);font-weight:600}
.card[data-done="1"] .cardbtns .go{background:var(--sage)}

.detail{border-top:1px solid var(--line);padding:13px 14px}
.detail .row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--mute);padding:4px 0;gap:12px}
.detail .row b{color:var(--bone);font-weight:500;text-align:right}
.spark{width:100%;height:52px;display:block;margin:10px 0 4px}

.sheet-bg{position:fixed;inset:0;background:rgba(8,10,14,.72);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--slab);border-top:1px solid var(--line);
  max-height:92vh;overflow-y:auto;max-width:640px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.sheet-h{position:sticky;top:0;background:var(--slab);border-bottom:1px solid var(--line);padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-h .nm{font-size:15px;font-weight:600;line-height:1.25}
.sheet-h .mg{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.sheet-h button{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);flex:0 0 auto}
.sheet-b{padding:16px}

.stepper{margin-bottom:16px}
.stepper .lab{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:7px}
.stepper .ctl{display:flex;align-items:stretch;border:1px solid var(--line)}
.stepper .ctl button{width:62px;font-family:var(--disp);font-size:26px;color:var(--mute);background:var(--slab2)}
.stepper .ctl button:active{color:var(--amber)}
.stepper .ctl input{flex:1;min-width:0;text-align:center;background:transparent;border:none;outline:none;
  color:var(--bone);font-family:var(--disp);font-size:38px;padding:11px 4px}
.quick{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.quick button{padding:7px 12px;border:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--mute)}
.quick button:active{border-color:var(--amber);color:var(--amber)}

.big{display:block;width:100%;padding:15px;background:var(--amber);color:var(--ink);font-family:var(--mono);
  font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;text-align:center}
.big[data-alt="1"]{background:transparent;border:1px solid var(--line);color:var(--mute);font-weight:400}
.big:disabled{opacity:.35}

.setlist{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.setrow{display:flex;align-items:center;gap:10px;padding:9px 0;font-family:var(--mono);font-size:13px;border-bottom:1px solid var(--line)}
.setrow .i{color:var(--mute);font-size:10px;width:26px;letter-spacing:.1em}
.setrow .v{flex:1}
.setrow .v em{font-style:normal;color:var(--mute);font-size:11px}
.setrow button{color:var(--mute);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:4px 2px}

.sess{border:1px solid var(--line);background:var(--slab);margin-bottom:10px;padding:12px 14px}
.sess .d{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--amber)}
.sess .ex{margin-top:9px}
.sess .ex .n{font-size:13.5px;font-weight:600}
.sess .ex .s{font-family:var(--mono);font-size:11.5px;color:var(--mute);margin-top:2px;line-height:1.7}

.pick{display:block;width:100%;text-align:left;padding:13px 14px;border-bottom:1px solid var(--line)}
.pick .n{font-size:14px}
.pick .m{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:2px}
.search{width:100%;padding:12px 14px;background:var(--slab2);border:1px solid var(--line);color:var(--bone);font-size:16px;outline:none}
.search:focus{border-color:var(--amber)}

.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:rgba(15,18,25,.96);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;padding:14px 4px 16px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.nav button[data-on="1"]{color:var(--amber);box-shadow:inset 0 2px 0 var(--amber)}

.empty{text-align:center;padding:48px 20px;color:var(--mute);font-size:13.5px;line-height:1.6}
.note{font-family:var(--mono);font-size:10.5px;color:var(--mute);line-height:1.7}
.toast{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  z-index:50;background:var(--amber);color:var(--ink);padding:9px 16px;font-family:var(--mono);font-size:11.5px;
  letter-spacing:.08em;text-transform:uppercase;font-weight:600;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = ()=>Math.random().toString(36).slice(2,9);
const pad = n=>String(n).padStart(2,"0");
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function fmtDate(iso){ const [y,m,d]=iso.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"}); }
function daysAgo(iso){ const [y,m,d]=iso.split("-").map(Number); const t=new Date(y,m-1,d);
  const n=new Date(); n.setHours(0,0,0,0); return Math.round((n-t)/86400000); }
function agoLabel(iso){ const n=daysAgo(iso);
  if(n<=0) return "today"; if(n===1) return "yesterday"; if(n<7) return n+" days ago";
  if(n<14) return "last week"; return Math.floor(n/7)+" weeks ago"; }
const epley = (w,r)=>w*(1+r/30);
const nice = n=>String(Math.round(n*100)/100);

/* Working weight: lightest weight from the most recent session that hasn't
   yet banked 100 cumulative reps across all sessions. */
function analyse(entries){
  if(!entries.length) return null;
  const sorted=[...entries].sort((a,b)=>a.d<b.d?1:-1);
  const lastDate=sorted[0].d;
  const last=sorted.filter(e=>e.d===lastDate);
  const cum=new Map();
  for(const e of entries) for(const s of e.sets) cum.set(s.w,(cum.get(s.w)||0)+s.r);
  const lastWeights=[...new Set(last.flatMap(e=>e.sets.map(s=>s.w)))].sort((a,b)=>a-b);
  const open=lastWeights.filter(w=>(cum.get(w)||0)<GOAL);
  const best1rm=Math.max(...entries.flatMap(e=>e.sets.map(s=>epley(s.w,s.r))));
  const trend=[...entries].sort((a,b)=>a.d<b.d?-1:1)
    .map(e=>({d:e.d,v:Math.max(...e.sets.map(s=>epley(s.w,s.r)))}));
  if(!open.length){
    return {complete:true,lastDate,weight:lastWeights[lastWeights.length-1],banked:GOAL,toGo:0,
            fromLast:0,lastWeights,cum,best1rm,trend};
  }
  const weight=open[0], banked=cum.get(weight)||0;
  const fromLast=last.reduce((t,e)=>t+e.sets.filter(s=>s.w===weight).reduce((u,s)=>u+s.r,0),0);
  return {complete:false,lastDate,weight,banked,toGo:GOAL-banked,fromLast,lastWeights,cum,best1rm,trend};
}

/* Bodyweight: no useful load, so progress is reps in a single set.
   Goal is to beat your best set. */
function isBW(entries){
  return Math.max(...entries.flatMap(e=>e.sets.map(s=>s.w))) <= 1;
}
function analyseBW(entries){
  const sorted=[...entries].sort((a,b)=>a.d<b.d?1:-1);
  const lastDate=sorted[0].d;
  const last=sorted.filter(e=>e.d===lastDate);
  const lastBest=Math.max(...last.flatMap(e=>e.sets.map(s=>s.r)));
  const trend=[...entries].sort((a,b)=>a.d<b.d?-1:1)
    .map(e=>({d:e.d,v:Math.max(...e.sets.map(s=>s.r))}));
  const pb=Math.max(...trend.map(t=>t.v));
  const before=trend.slice(0,-1);
  const prevPB=before.length?Math.max(...before.map(t=>t.v)):0;
  const fresh = lastBest>=pb && lastBest>prevPB;   // best was set in the latest session
  const totalReps=entries.reduce((t,e)=>t+e.sets.reduce((u,s)=>u+s.r,0),0);
  return {bw:true,lastDate,pb,prevPB,lastBest,target:pb+1,fresh,totalReps,trend,
          sessions:entries.length,weight:1};
}

let D = load();
if(!D || !D.entries){
  D = {entries:SEED.entries.map(e=>Object.assign({id:uid()},e)), timeEntries:SEED.timeEntries, bank:SEED.bank};
  save();
}
const S = {tab:"train", filter:"All", expanded:null, logging:null, picking:false, q:"", w:10, r:10};

function stats(){
  const by=new Map();
  for(const e of D.entries){ if(!by.has(e.e)) by.set(e.e,[]); by.get(e.e).push(e); }
  return [...by.entries()].map(([name,es])=>({name,muscle:es[0].m||"Other",
      a: isBW(es)?analyseBW(es):analyse(es), n:es.length}))
    .filter(x=>x.a)
    .sort((a,b)=> a.a.lastDate<b.a.lastDate?1 : a.a.lastDate>b.a.lastDate?-1 : a.name.localeCompare(b.name));
}

let toastTimer;

/* ---------- fragments ---------- */
function tallyHTML(a){
  let out='<div class="tally" aria-label="'+Math.min(a.banked,GOAL)+' of '+GOAL+' reps banked">';
  const filled=Math.min(a.banked,GOAL), fresh=Math.min(a.fromLast||0,filled), oldN=filled-fresh;
  for(let i=0;i<GOAL;i++){
    const s = a.complete ? (i<filled?"done":"") : (i<oldN?"old":(i<filled?"new":""));
    out+='<i data-s="'+s+'"></i>';
  }
  return out+"</div>";
}
function ladderHTML(a){
  const cells=a.target, cols=cells>20?12:10;
  let out='<div class="tally" data-cols="'+cols+'" aria-label="Best set '+a.lastBest+' of '+a.target+' to beat">';
  for(let i=0;i<cells;i++){
    const s = i<a.lastBest ? (a.fresh?"done":"new") : "";
    out+='<i data-s="'+s+'"'+(i===a.pb-1?' data-pb="1"':'')+'></i>';
  }
  return out+"</div>";
}
function sparkHTML(trend){
  if(!trend||trend.length<2) return "";
  const w=300,h=52,p=4, vals=trend.map(t=>t.v);
  const lo=Math.min(...vals), hi=Math.max(...vals), span=(hi-lo)||1, n=trend.length;
  const X=i=>p+(i*(w-p*2))/(n-1), Y=v=>h-p-((v-lo)/span)*(h-p*2);
  const d=trend.map((t,i)=>(i?"L":"M")+X(i).toFixed(1)+","+Y(t.v).toFixed(1)).join(" ");
  const sx=(n-1)/2, sy=vals.reduce((a,b)=>a+b,0)/n;
  let num=0,den=0; vals.forEach((v,i)=>{num+=(i-sx)*(v-sy); den+=(i-sx)*(i-sx);});
  const m=den?num/den:0, y0=sy+m*(0-sx), y1=sy+m*(n-1-sx);
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="Estimated 1-rep max over time">'
    +'<line x1="'+X(0)+'" y1="'+Y(y0)+'" x2="'+X(n-1)+'" y2="'+Y(y1)+'" stroke="#5FB392" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>'
    +'<path d="'+d+'" fill="none" stroke="#F2A63C" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>'
    +trend.map((t,i)=>'<circle cx="'+X(i)+'" cy="'+Y(t.v)+'" r="1.9" fill="#F2A63C"/>').join("")
    +'</svg>';
}

function viewTrain(){
  const st=stats();

  const shown = S.filter==="All" ? st : st.filter(s=>s.muscle===S.filter);
  let h='<div class="wrap">';

  if(st[0]){
    const names=[...new Set(D.entries.filter(e=>e.d===st[0].a.lastDate).map(e=>e.e))].join(" · ");
    h+='<div class="strip"><div class="t">Last session · '+agoLabel(st[0].a.lastDate)+'</div><div class="b">'+esc(names)+'</div></div>';
  }
  h+='<div class="chips">'+groups.map(g=>'<button class="chip" data-on="'+(S.filter===g?1:0)+'" data-act="filter" data-v="'+esc(g)+'">'+esc(g)+'</button>').join("")+'</div>';

  for(const s of shown){
    const a=s.a, open=S.expanded===s.name;
    const flag = a.bw ? (a.fresh?1:0) : (a.complete?1:0);
    h+='<div class="card" data-done="'+flag+'">'
      +'<div class="card-h"><div class="mg">'+esc(s.muscle)+(a.bw?' · bodyweight':'')+'</div><div class="nm">'+esc(s.name)+'</div>'
      +'<div class="ago">Last trained '+agoLabel(a.lastDate)+'</div></div>';

    if(a.bw){
      h+='<div class="wt"><span class="n">'+a.pb+'</span><span class="u">reps</span>'
        +'<span class="lbl">'+(a.fresh?"new best":"best")+'<br>set</span></div>'
        + ladderHTML(a)
        +'<div class="meter">'
        + (a.fresh ? '<span>up from <b>'+a.prevPB+'</b></span><span class="go">Beat '+a.target+' next</span>'
                   : '<span>last session <b>'+a.lastBest+'</b></span><span class="go">'+(a.target-a.lastBest)+' more for a best</span>')
        +'</div>';
    } else {
      h+='<div class="wt"><span class="n">'+nice(Math.abs(a.weight))+'</span><span class="u">kg'+(a.weight<0?' assist':'')+'</span>'
        +'<span class="lbl">'+(a.complete?"cleared":"working")+'<br>'+(a.weight<0?'assistance':'weight')+'</span></div>'
        + tallyHTML(a)
        +'<div class="meter">'
        + (a.complete ? '<span><b>'+GOAL+'</b> reps banked</span><span class="go">'+(a.weight<0?"Cut the assist":"Go heavier")+'</span>'
                      : '<span><b>'+a.banked+'</b> of '+GOAL+' reps</span><span class="go">'+a.toGo+' to go</span>')
        +'</div>';
    }
    h+='<div class="cardbtns">'
      +'<button data-act="expand" data-v="'+esc(s.name)+'">'+(open?"Hide":"Details")+'</button>'
      +'<button class="go" data-act="log" data-v="'+esc(s.name)+'">Log a set</button></div>';

    if(open && a.bw){
      h+='<div class="detail">'+sparkHTML(a.trend)
        +'<div class="note" style="margin-bottom:8px">Best set each session · are you getting stronger?</div>'
        +'<div class="row"><span>Best set</span><b>'+a.pb+' reps</b></div>'
        +'<div class="row"><span>Sessions logged</span><b>'+a.sessions+'</b></div>'
        +'<div class="row"><span>Total reps all time</span><b>'+a.totalReps+'</b></div>'
        +'<div class="row" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px"><span>Best set by session</span></div>';
      a.trend.slice(-8).reverse().forEach(t=>{
        h+='<div class="row"><span>'+fmtDate(t.d)+'</span><b'+(t.v>=a.pb?' style="color:var(--sage)"':'')+'>'+t.v+' reps'+(t.v>=a.pb?" ✓":"")+'</b></div>';
      });
      h+='</div>';
    }
    else if(open){
      h+='<div class="detail">'+sparkHTML(a.trend)
        +'<div class="note" style="margin-bottom:8px">Estimated 1-rep max · are you getting stronger?</div>'
        +'<div class="row"><span>Best estimated 1RM</span><b>'+nice(a.best1rm)+' kg</b></div>'
        +'<div class="row"><span>Sessions logged</span><b>'+s.n+'</b></div>'
        +'<div class="row"><span>Weights in last session</span><b>'+a.lastWeights.map(w=>nice(Math.abs(w))+(w<0?"a":"")).join(", ")+' kg</b></div>'
        +'<div class="row" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px"><span>Rep bank by weight</span></div>';
      [...a.cum.entries()].sort((x,y)=>x[0]-y[0]).forEach(([w,n])=>{
        h+='<div class="row"><span>'+nice(Math.abs(w))+' kg'+(w<0?' assist':'')+'</span><b'+(n>=GOAL?' style="color:var(--sage)"':'')+'>'+n+' reps'+(n>=GOAL?" ✓":"")+'</b></div>';
      });
      h+='</div>';
    }
    h+='</div>';
  }
  h+='<button class="big" data-alt="1" data-act="pick" style="margin-top:6px">+ Log a different exercise</button>';
  if(!shown.length) h+='<div class="empty">Nothing logged in this group yet.</div>';
  return h+'</div>';
}

function viewHistory(){
  const by=new Map();
  for(const e of D.entries){ if(!by.has(e.d)) by.set(e.d,[]); by.get(e.d).push(e); }
  const days=[...by.entries()].sort((a,b)=>a[0]<b[0]?1:-1);
  let h='<div class="wrap"><div class="eyebrow">'+days.length+' sessions</div>';
  for(const [d,es] of days){
    h+='<div class="sess"><div class="d">'+fmtDate(d)+' · '+d+'</div>';
    for(const e of es){
      h+='<div class="ex"><div class="n">'+esc(e.e)+'</div><div class="s">'
        +e.sets.map(s=>nice(s.w)+"×"+s.r).join("&nbsp;&nbsp; ")+'</div></div>';
    }
    h+='</div>';
  }
  if(!days.length) h+='<div class="empty">No sessions yet. Log your first set from the Train tab.</div>';
  return h+'</div>';
}

  $("#app").innerHTML =
    '<div class="hdr"><h1>Rep<span>Bank</span></h1><div class="date">'+fmtDate(todayISO())+'</div></div>'
    + (S.tab==="train"?viewTrain():S.tab==="history"?viewHistory():viewData())
    + '<div class="nav">'
    + [["train","Train"],["history","History"],["data","Data"]]
        .map(([k,l])=>'<button data-act="tab" data-v="'+k+'" data-on="'+(S.tab===k?1:0)+'">'+l+'</button>').join("")
    + '</div>';
  renderSheet();
}

/* ---------- sheets ---------- */
function todaySets(name){
  const e=D.entries.find(x=>x.d===todayISO() && x.e===name);
  return e?e.sets:[];
}
function renderSheet(){
  const el=$("#sheet");
  if(S.picking){ el.innerHTML=pickerHTML(); const s=$("#q"); if(s) s.focus(); return; }
  if(!S.logging){ el.innerHTML=""; return; }
  el.innerHTML=logHTML();
}
function logHTML(){
  const name=S.logging.n, sets=todaySets(name);
  const bw = S.logging.bw, pb = S.logging.pb;
  return '<div class="sheet-bg" data-act="close"></div><div class="sheet" role="dialog" aria-label="Log '+esc(name)+'">'
    +'<div class="sheet-h"><div><div class="mg">'+esc(S.logging.m)+' · '+fmtDate(todayISO())+'</div>'
    +'<div class="nm">'+esc(name)+'</div></div><button data-act="close">Done</button></div><div class="sheet-b">'
    +(bw
      ? '<input type="hidden" id="fw" value="1">'
        +'<div class="note" style="margin:-4px 0 16px">Bodyweight · your best set is '+pb+' reps. '+(pb+1)+' beats it.</div>'
      : '<div class="stepper"><div class="lab">Weight · kg'+(S.w<0?' · assisted, keep it negative':'')+'</div><div class="ctl">'
        +'<button data-act="bump" data-f="w" data-v="-1" aria-label="Decrease weight">−</button>'
        +'<input id="fw" inputmode="decimal" value="'+nice(S.w)+'" aria-label="Weight in kilograms">'
        +'<button data-act="bump" data-f="w" data-v="1" aria-label="Increase weight">+</button></div></div>')
    +'<div class="stepper"><div class="lab">Reps</div><div class="ctl">'
    +'<button data-act="bump" data-f="r" data-v="-1" aria-label="Decrease reps">−</button>'
    +'<input id="fr" inputmode="numeric" value="'+S.r+'" aria-label="Reps">'
    +'<button data-act="bump" data-f="r" data-v="1" aria-label="Increase reps">+</button></div>'
    +'<div class="quick">'+(bw?[pb-2,pb-1,pb,pb+1].filter(q=>q>0):[5,8,10,12,15]).map(q=>'<button data-act="quickrep" data-v="'+q+'">'+q+'</button>').join("")+'</div></div>'
    +'<button class="big" data-act="add">Add set</button>'
    +'<div class="setlist"><div class="lab" style="font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:6px">Today · '+sets.length+' '+(sets.length===1?"set":"sets")+'</div>'
    +(sets.length?sets.map((s,i)=>'<div class="setrow"><span class="i">'+pad(i+1)+'</span>'
        +'<span class="v">'+nice(s.w)+' kg × '+s.r+' <em>· '+Math.round(s.w*s.r)+' kg volume</em></span>'
        +'<button data-act="undo" data-v="'+i+'">Undo</button></div>').join("")
      :'<div class="note" style="padding-top:6px">No sets logged yet today.</div>')
    +'</div></div></div>';
}
function pickerHTML(){
  const q=S.q.toLowerCase();
  const list=D.bank.filter(b=>b.c==="Strength" && b.n.toLowerCase().includes(q));
  const isNew=S.q.trim() && !D.bank.some(b=>b.n.toLowerCase()===S.q.trim().toLowerCase());
  return '<div class="sheet-bg" data-act="close"></div><div class="sheet" role="dialog" aria-label="Choose an exercise">'
    +'<div class="sheet-h"><div class="nm">Choose an exercise</div><button data-act="close">Cancel</button></div>'
    +'<div style="padding:12px 14px 0"><input id="q" class="search" placeholder="Search or type a new one" value="'+esc(S.q)+'"></div>'
    +(isNew?'<button class="pick" data-act="pickone" data-v="'+esc(S.q.trim())+'" data-m="Other"><div class="n" style="color:var(--amber)">Add “'+esc(S.q.trim())+'”</div><div class="m">New exercise</div></button>':"")
    +list.map(b=>'<button class="pick" data-act="pickone" data-v="'+esc(b.n)+'" data-m="'+esc(b.m)+'"><div class="n">'+esc(b.n)+'</div><div class="m">'+esc(b.m)+'</div></button>').join("")
    +'<div style="height:28px"></div></div>';
}

/* ---------- actions ---------- */
function addSet(){
  const w=parseFloat($("#fw").value), r=parseInt($("#fr").value,10);
  if(isNaN(w)||isNaN(r)||r<=0){ toast("Enter a weight and reps"); return; }
  S.w=w; S.r=r;
  const today=todayISO(), name=S.logging.n;
  let e=D.entries.find(x=>x.d===today && x.e===name);
  if(e) e.sets.push({w,r});
  else D.entries.push({id:uid(),d:today,e:name,m:S.logging.m,sets:[{w,r}]});
  if(!D.bank.some(b=>b.n===name)) D.bank.push({n:name,m:S.logging.m,c:"Strength",pt:"Strength Score"});
  save(); render(); toast(nice(w)+" kg × "+r+" banked");
}
function undoSet(i){
  const today=todayISO(), name=S.logging.n;
  const idx=D.entries.findIndex(x=>x.d===today && x.e===name);
  if(idx<0) return;
  D.entries[idx].sets.splice(i,1);
  if(!D.entries[idx].sets.length) D.entries.splice(idx,1);
  save(); render();
}
function download(name, text, type){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type}));
  a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
}
function exportCSV(){
  const max=Math.max(1,...D.entries.map(e=>e.sets.length));
  const head=["Date","Exercise","Muscle Group"];
  for(let i=1;i<=max;i++) head.push("Set "+i+" Weight","Set "+i+" Reps");
  head.push("Session Volume","Best Set Estimated Strength Score");
  const rows=[...D.entries].sort((a,b)=>a.d<b.d?-1:1).map(e=>{
    const r=[e.d,e.e,e.m||""];
    for(let i=0;i<max;i++){ r.push(e.sets[i]?e.sets[i].w:"", e.sets[i]?e.sets[i].r:""); }
    r.push(e.sets.reduce((t,s)=>t+s.w*s.r,0), nice(Math.max(...e.sets.map(s=>epley(s.w,s.r)))));
    return r;
  });
  const csv=[head,...rows].map(r=>r.map(c=>/[",\n]/.test(String(c))?'"'+String(c).replace(/"/g,'""')+'"':c).join(",")).join("\n");
  download("gym-log-"+todayISO()+".csv", csv, "text/csv");
}
function restore(){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const parsed=JSON.parse(fr.result);
        if(!parsed || !Array.isArray(parsed.entries)) throw new Error("bad shape");
        D=parsed; save(); render(); toast("Backup restored");
      }catch(e){ toast("That file isn't a RepBank backup"); }
    };
    fr.readAsText(f);
  };
  inp.click();
}

/* ---------- events ---------- */
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-act]");
  if(!t) return;
  const act=t.dataset.act, v=t.dataset.v;
  if(act==="tab"){ S.tab=v; S.expanded=null; render(); }
  else if(act==="filter"){ S.filter=v; render(); }
  else if(act==="expand"){ S.expanded = S.expanded===v ? null : v; render(); }
  else if(act==="log"){
    const s=stats().find(x=>x.name===v);
    S.logging={n:v,m:s.muscle,bw:!!s.a.bw,pb:s.a.pb||0};
    S.w = s.a.bw ? 1 : (s.a.complete ? s.a.weight+2.5 : s.a.weight);
    S.r = s.a.bw ? s.a.pb : 10; renderSheet();
  }
  else if(act==="pick"){ S.picking=true; S.q=""; renderSheet(); }
  else if(act==="pickone"){
    S.picking=false;
    const s=stats().find(x=>x.name===v);
    const bw = s && s.a.bw;
    S.logging={n:v,m:t.dataset.m,bw:!!bw,pb:bw?s.a.pb:0};
    S.w = bw ? 1 : (s ? s.a.weight : 10);
    S.r = bw ? s.a.pb : 10; renderSheet();
  }
  else if(act==="close"){ S.logging=null; S.picking=false; renderSheet(); }
  else if(act==="bump"){
    const f=t.dataset.f, dir=Number(v), inp=$(f==="w"?"#fw":"#fr");
    const step=f==="w"?2.5:1;
    let n=parseFloat(inp.value); if(isNaN(n)) n=0;
    n=Math.round((n+dir*step)*100)/100;
    inp.value = f==="w" ? nice(n) : String(n);
    if(f==="w") S.w=n; else S.r=n;
  }
  else if(act==="quickrep"){ $("#fr").value=v; S.r=Number(v); }
  else if(act==="add"){ addSet(); }
  else if(act==="undo"){ undoSet(Number(v)); }
  else if(act==="csv"){ exportCSV(); }
  else if(act==="backup"){ download("repbank-backup-"+todayISO()+".json", JSON.stringify(D), "application/json"); }
  else if(act==="restore"){ restore(); }
  else if(act==="reset"){
    if(confirm("Clear everything and reload the original workbook data? Sets logged in the app will be lost.")){
      D={entries:SEED.entries.map(e=>Object.assign({id:uid()},e)),timeEntries:SEED.timeEntries,bank:SEED.bank};
      save(); render(); toast("Reset");
    }
  }
});
document.addEventListener("input",ev=>{
  if(ev.target.id==="q"){ S.q=ev.target.value;
    const el=$("#sheet"); const pos=ev.target.selectionStart;
    el.innerHTML=pickerHTML(); const n=$("#q"); n.focus(); n.setSelectionRange(pos,pos);
  }
});

render();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
